[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "equity-factor-lab"
version = "0.1.0"
description = "Cross-sectional equity factor research pipeline using SimFin data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Miroslav Ghanem" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "simfin>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
notebook = [
    "matplotlib>=3.7",
    "ipykernel>=6.0",
    "notebook>=7.0",
    "jupyterlab>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["equity_factor_lab*"]

[tool.setuptools]
package-dir = {"" = "src"}
